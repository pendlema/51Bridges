<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="51Bridges CrossFit Class Schedule - View our current class times and book your spot.">
    <title>Class Schedule - 51Bridges CrossFit</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="schedule.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Schedule Section -->
    <section class="schedule-hero">
        <div class="container">
            <h1>Class Schedule</h1>
            <p>Check out our current class times and sign up for a session that works for you.</p>
        </div>
    </section>

    <section class="schedule-section">
        <div class="container">
            <div class="schedule-container">
                <iframe src="https://www.wodboard.com/locations/162/timetable/b5dd6b041b" style="width:100%; height:100%; min-height: 700px; border: 0;"></iframe>
            </div>
        </div>
    </section>


    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
    <script>
        // Load header
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                // Initialize mobile menu AND scroll effect after header is loaded
                initMobileMenu();
                initScrollEffect();
            })
            .catch(error => console.error('Error loading header:', error));

        // Load footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));</script>
</body>
</html>
