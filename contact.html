<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="51Bridges CrossFit Class Schedule - View our current class times and book your spot.">
    <title>Class Schedule - 51Bridges CrossFit</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Contact Hero Section -->
    <section class="contact-hero">
        <div class="container">
            <h1>Visit Us</h1>
            <p class="hero-subtitle">Located in the heart of Rockville, our fit family is ready to welcome you. Drop by to check it out or schedule your free 3-day trial today.</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-info">
                    <div class="info-card">
                        <h3>📍 Location</h3>
                        <p>
                            51 Bridges CrossFit<br>
                            115 E. Pennsylvania St.<br>
                            Rockville, IN 47872
                        </p>
                    </div>
                    <div class="info-card">
                        <h3>📞 Phone</h3>
                        <p><a href="tel:+17652045511" class="contact-link">(765) 204-5511</a></p>
                    </div>
                    <div class="info-card">
                        <h3>✉ Email</h3>
                        <p><a href="mailto:info@51bridges.com" class="contact-link">info@51bridges.com</a></p>
                    </div>
                </div>
                <div class="schedule-container">
                    <div class="google-map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2579.079008773284!2d-87.22629071673022!3d39.76078129081924!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x886d47738caf7b99%3A0x9eef947146d9b04a!2s51%20Bridges%20CrossFit!5e0!3m2!1sen!2sus!4v1770998189785!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
    <script>
        // Load header
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                // Initialize mobile menu AND scroll effect after header is loaded
                initMobileMenu();
                initScrollEffect();
            })
            .catch(error => console.error('Error loading header:', error));

        // Load footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));</script>
</body>
</html>
