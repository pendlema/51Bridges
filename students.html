<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="51Bridges CrossFit Program">
    <title>CrossFit</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="program.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Schedule Hero Section -->
    <section class="program-hero">
        <div class="container">
            <h1>Students</h1>
        </div>
    </section>


    <section class="team-section">
        <div class="container">
            <p>We offer a reduced membership rate for full-time students who would like to join our CrossFit class ages 13-22. Valid student ID required.</p>
            <br />
            <p>An assessment in our Orientation class is required, along with a conversation and meeting with a parent.</p>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="main.js"></script>
    <script>
        // Load header
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                // Initialize mobile menu AND scroll effect after header is loaded
                initMobileMenu();
                initScrollEffect();
            })
            .catch(error => console.error('Error loading header:', error));

        // Load footer
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));</script>
</body>
</html>
